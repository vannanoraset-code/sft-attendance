<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f2f55" />
<title>SF&T Attendance</title>
<style>
:root{--navy:#0f2f55;--red:#e31b23;--green:#169c48;--blue:#1683e8;--orange:#f5a623;--purple:#7f56d9;--bg:#eef3f8;--card:#fff;--text:#152238;--muted:#6b7b8f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,#092746,#123e6d);color:#fff;padding:14px 14px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}.head{display:flex;align-items:center;gap:12px}.head img{width:68px;height:48px;object-fit:contain;background:#fff;border-radius:8px}.head h1{font-size:20px;margin:0}.head p{margin:2px 0 0;font-size:12px;opacity:.85}.tabs{display:flex;gap:8px;margin-top:12px;overflow:auto;padding-bottom:2px}.tab{border:0;border-radius:999px;padding:9px 14px;background:#ffffff1f;color:#fff;white-space:nowrap}.tab.active{background:#fff;color:var(--navy);font-weight:700}
main{padding:12px;max-width:1180px;margin:auto}.panel{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #00000012}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;min-height:44px;padding:9px 10px;border:1px solid #ccd6e0;border-radius:10px;background:#fff;font-size:16px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn{border:0;border-radius:10px;min-height:44px;padding:9px 13px;font-weight:700}.primary{background:var(--navy);color:#fff}.danger{background:#ffe5e5;color:#a00}.soft{background:#edf3f9;color:var(--navy)}.success{background:#e6f6ed;color:#106b35}.employee-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.emp{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #d8e0e8}.emp-top{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px}.emp img{width:84px;height:96px;border-radius:10px;object-fit:cover;background:#dde5ec}.emp h3{margin:2px 0 4px;font-size:18px}.muted{color:var(--muted);font-size:12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chip{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f8}.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#8a5b3d;color:white;font-weight:800;margin-right:6px}.emp-controls{padding:0 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.emp-controls .full{grid-column:1/-1}.status-work{border-left:5px solid var(--green)}.status-off{border-left:5px solid var(--red)}.status-leave{border-left:5px solid #f1c40f}.shift{font-weight:800;padding:8px 10px;color:#fff}.s-1700{background:var(--green)}.s-1800{background:#3c9ad9}.s-1900{background:var(--blue)}.s-2000{background:var(--purple)}.s-2100{background:var(--orange)}.s-2200{background:var(--red)}.s-off{background:var(--red)}.s-leave{background:#d9a700;color:#1d1d1d}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f5f8fb;border-radius:12px;padding:10px}.metric b{font-size:22px;display:block}.hide{display:none!important}.notice{padding:10px;border-radius:10px;background:#fff7d6;color:#6c5200;margin-bottom:10px}.sync{font-size:12px;padding:6px 10px;border-radius:999px;background:#ffffff1c;color:#fff;margin-left:auto}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:50}.modal-card{background:#fff;border-radius:16px;padding:14px;max-width:460px;width:100%;max-height:88%;overflow:auto}.modal-card h2{margin-top:0}.photo-preview{width:110px;height:130px;object-fit:cover;border-radius:10px;background:#eef3f8;display:block;margin-bottom:8px}.table-wrap{overflow:auto}.history{width:100%;border-collapse:collapse;min-width:720px}.history th,.history td{padding:8px;border-bottom:1px solid #e4e9ef;text-align:left;font-size:13px}.history th{background:#f2f6fa;position:sticky;top:0}.pill{padding:4px 7px;border-radius:8px;font-size:11px;font-weight:700}.work{background:#def4e7;color:#126c35}.off{background:#ffe1e1;color:#a60000}.leave{background:#fff0b3;color:#6c5100}
@media(max-width:620px){main{padding:8px}.grid2,.grid3{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.employee-list{grid-template-columns:1fr}.emp-top{grid-template-columns:78px 1fr}.emp img{width:78px;height:92px}.head h1{font-size:17px}}
</style>

let employees=[], records=[], stats={};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
async function api(path,opts={}){
  if(path.startsWith('sft_attendance_employees?select=')){const x=await edge('action=employees');return x.rows||[]}
  if(path.startsWith('sft_attendance_records?select=*,sft_attendance_employees')){const a=(path.match(/work_date=gte\.([^&]+)/)||[])[1]||'1900-01-01',b=(path.match(/work_date=lte\.([^&]+)/)||[])[1]||'2999-12-31';const x=await edge('action=history&from='+encodeURIComponent(a)+'&to='+encodeURIComponent(b));return x.rows||[]}
  if(path.startsWith('sft_attendance_records?select=')){const m=path.match(/work_date=eq\.([^&]+)/);const x=await edge('action=records'+(m?'&date='+encodeURIComponent(m[1]):''));return x.rows||[]}
  if(path.startsWith('sft_attendance_records?on_conflict=')){await edge('action=save-records',{method:'POST',body:opts.body});return null}
  if(path.startsWith('sft_attendance_employees?id=eq.') && opts.method==='PATCH'){const id=Number((path.match(/id=eq\.(\d+)/)||[])[1]);const body=JSON.parse(opts.body||'{}');if(body.is_active===false){await edge('action=remove-employee',{method:'POST',body:JSON.stringify({id})})}else{await edge('action=save-employee',{method:'POST',body:JSON.stringify({...body,id})})}return null}
  if(path==='sft_attendance_employees' && opts.method==='POST'){await edge('action=save-employee',{method:'POST',body:opts.body});return null}
  throw new Error('คำสั่ง API ไม่รองรับ: '+path)
}
function sync(msg,ok=true){$('#syncState').textContent=msg;$('#syncState').style.background=ok?'#ffffff1c':'#8b1d1d'}
function shiftClass(start,end,status){if(status==='off')return's-off';if(status==='leave')return's-leave';if(end==='17:00:00'||end==='17:00')return's-1700';if(end==='18:00:00'||end==='18:00')return's-1800';if(end==='19:00:00'||end==='19:00')return's-1900';if(end==='20:00:00'||end==='20:00')return's-2000';if(end==='21:00:00'||end==='21:00')return's-2100';return's-2200'}
function fmtMoney(n){return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0})+' บาท'}
function recFor(id){return records.find(r=>r.employee_id===id)||{employee_id:id,status:'work',start_time:'08:00',end_time:'17:00',advance_amount:0,note:''}}
function advanceCycleStart(dateStr){const d=new Date(dateStr+'T00:00:00');const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();let s;if(day>=25)s=new Date(y,m,25);else if(day>=10)s=new Date(y,m,10);else s=new Date(y,m-1,25);const min=new Date('2026-09-01T00:00:00');if(s<min)s=min;return s.toISOString().slice(0,10)}
function workedMinutes(start,end){if(!start||!end)return 0;const [sh,sm]=String(start).slice(0,5).split(':').map(Number),[eh,em]=String(end).slice(0,5).split(':').map(Number);if([sh,sm,eh,em].some(Number.isNaN))return 0;let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=24*60;return Math.max(0,mins)}
async function loadStats(){const all=await api('sft_attendance_records?select=employee_id,status,work_date,start_time,end_time,advance_amount&order=work_date.asc');const selected=$('#workDate').value,cycle=advanceCycleStart(selected);stats={};for(const e of employees)stats[e.id]={work:0,off:0,leave:0,advance:0,totalMinutes:0};for(const r of all||[]){if(!stats[r.employee_id])continue;if(r.work_date>='2026-09-01'&&r.work_date<=selected){stats[r.employee_id][r.status]=(stats[r.employee_id][r.status]||0)+1;if(r.status==='work')stats[r.employee_id].totalMinutes+=workedMinutes(r.start_time,r.end_time)}if(r.work_date>=cycle&&r.work_date<=selected)stats[r.employee_id].advance+=Number(r.advance_amount||0)} }
async function loadDaily(){sync('กำลังโหลด…');try{employees=await api('sft_attendance_employees?select=*&is_active=eq.true&order=sort_seed.asc');await loadStats();const d=$('#workDate').value;records=await api('sft_attendance_records?select=*&work_date=eq.'+d);renderDaily();renderManage();sync('ซิงก์แล้ว ✓')}catch(e){console.error(e);sync('เชื่อมข้อมูลไม่สำเร็จ',false)}}
function rankEmployees(){return [...employees].sort((a,b)=>{const sa=stats[a.id]||{},sb=stats[b.id]||{},ra=recFor(a.id),rb=recFor(b.id);const todayA=ra.status==='work'?workedMinutes(ra.start_time,ra.end_time):0,todayB=rb.status==='work'?workedMinutes(rb.start_time,rb.end_time):0;const activeA=ra.status==='work'?1:0,activeB=rb.status==='work'?1:0;return (sb.work||0)-(sa.work||0)||(sb.totalMinutes||0)-(sa.totalMinutes||0)||activeB-activeA||todayB-todayA||(sa.off||0)-(sb.off||0)||(sa.leave||0)-(sb.leave||0)||(a.sort_seed||999)-(b.sort_seed||999)})}
function renderDaily(){const ranked=rankEmployees();const work=records.filter(r=>r.status==='work').length, off=records.filter(r=>r.status==='off').length, leave=records.filter(r=>r.status==='leave').length, adv=records.reduce((s,r)=>s+Number(r.advance_amount||0),0);$('#summary').innerHTML=`<div class="metric"><span>ทำงานวันนี้</span><b>${work}</b></div><div class="metric"><span>หยุดงาน</span><b>${off}</b></div><div class="metric"><span>ลา</span><b>${leave}</b></div><div class="metric"><span>เงินเบิกวันนี้</span><b>${fmtMoney(adv)}</b></div>`;$('#employeeList').innerHTML=ranked.map((e,i)=>card(e,i)).join('');bindDailyCards()}
function card(e,i){const r=recFor(e.id),s=stats[e.id]||{work:0,off:0,leave:0,advance:0};const cls=r.status==='off'?'status-off':r.status==='leave'?'status-leave':'status-work';const shift=r.status==='work'?`${(r.start_time||'08:00').slice(0,5)} - ${(r.end_time||'17:00').slice(0,5)}`:r.status==='off'?'หยุดงาน':'ลา';return `<article class="emp ${cls}" data-id="${e.id}"><div class="emp-top"><img src="${(e.photo_url&&EMBEDDED_PHOTOS[e.photo_url])||e.photo_url||''}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2284%22 height=%2296%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23dbe3ea%22/%3E%3C/svg%3E'"><div><h3><span class="rank">${i+1}</span>${e.name}</h3><div class="muted">${e.full_name||''}</div><div class="stats"><span class="chip">ทำงาน ${s.work||0} วัน</span><span class="chip">ชั่วโมงสะสม ${Math.floor((s.totalMinutes||0)/60)} ชม. ${Math.round((s.totalMinutes||0)%60)} นาที</span><span class="chip">หยุด ${s.off||0} วัน</span><span class="chip">ลา ${s.leave||0} วัน</span><span class="chip">เบิกสะสม ${fmtMoney(s.advance||0)}</span></div></div></div><div class="shift ${shiftClass(r.start_time,r.end_time,r.status)}">${shift}</div><div class="emp-controls"><div class="field"><label>สถานะ</label><select class="status"><option value="work" ${r.status==='work'?'selected':''}>ทำงาน</option><option value="off" ${r.status==='off'?'selected':''}>หยุดงาน</option><option value="leave" ${r.status==='leave'?'selected':''}>ลา</option></select></div><div class="field"><label>เงินเบิกวันนี้</label><input class="advance" type="number" min="0" step="1" value="${Number(r.advance_amount||0)}"></div><div class="field"><label>เข้า</label><input class="start" type="time" value="${(r.start_time||'08:00').slice(0,5)}"></div><div class="field"><label>ออก</label><input class="end" type="time" value="${(r.end_time||'17:00').slice(0,5)}"></div></div></article>`}
function bindDailyCards(){for(const el of $$('.emp[data-id]')){for(const sel of el.querySelectorAll('select,input'))sel.addEventListener('change',()=>updateLocal(el))}}
function updateLocal(el){const id=Number(el.dataset.id),r=recFor(id);r.status=el.querySelector('.status').value;r.advance_amount=Number(el.querySelector('.advance').value||0);r.start_time=el.querySelector('.start').value;r.end_time=el.querySelector('.end').value;if(!records.includes(r))records.push(r)}
$('#applyBulk').addEventListener('click',()=>{const [s,e]=$('#bulkShift').value.split('|');for(const emp of employees){let r=recFor(emp.id);r.status='work';r.start_time=s;r.end_time=e;if(!records.includes(r))records.push(r)}renderDaily()});
async function saveAllData(){sync('กำลังบันทึก…');const d=$('#workDate').value,site=$('#site').value.trim();const payload=employees.map(e=>{const r=recFor(e.id);return{employee_id:e.id,work_date:d,site,status:r.status,start_time:r.status==='work'?r.start_time:null,end_time:r.status==='work'?r.end_time:null,advance_amount:Number(r.advance_amount||0),note:r.note||''}});await api('sft_attendance_records?on_conflict=employee_id,work_date',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});await loadDaily();return true}
$('#saveAll').addEventListener('click',async()=>{try{await saveAllData()}catch(e){console.error(e);sync('บันทึกไม่สำเร็จ',false)}});
function thaiDateLong(dateStr){const d=new Date(dateStr+'T00:00:00');return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})}
function exportShiftColor(r){if(r.status==='off')return '#e50914';if(r.status==='leave')return '#d9a700';const e=(r.end_time||'17:00').slice(0,5);return e==='17:00'?'#139c43':e==='18:00'?'#48a9df':e==='19:00'?'#0b82ec':e==='20:00'?'#7d45b5':e==='21:00'?'#ef8b13':'#c62828'}
function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function fitText(ctx,text,maxW,startSize,minSize=16,weight='700'){let size=startSize;do{ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif`;if(ctx.measureText(text).width<=maxW)break;size-=1}while(size>minSize);return size}
function loadCanvasImage(src){return new Promise(resolve=>{if(!src)return resolve(null);const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>resolve(null);i.src=src})}
async function exportDailyImage(){
  sync('กำลังสร้างรูป…');
  try{await saveAllData()}catch(e){console.error(e);sync('บันทึกก่อนส่งออกไม่สำเร็จ',false);alert('บันทึกข้อมูลไม่สำเร็จ จึงยังส่งออกรูปไม่ได้');return}
  const ranked=rankEmployees(),date=$('#workDate').value,site=$('#site').value.trim()||'-';
  const W=1600,H=1520,margin=22,cols=6,gap=10,cardW=Math.floor((W-margin*2-gap*(cols-1))/cols),headerH=230,cardH=330;
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
  ctx.fillStyle='#071d35';ctx.fillRect(0,0,W,H);
  const grad=ctx.createLinearGradient(0,0,W,0);grad.addColorStop(0,'#092746');grad.addColorStop(.7,'#113f70');grad.addColorStop(1,'#7b0b18');ctx.fillStyle=grad;ctx.fillRect(0,0,W,headerH);
  const logoSrc=document.querySelector('.head img')?.src||'';const logo=await loadCanvasImage(logoSrc);if(logo){roundRect(ctx,24,28,245,105,12,'#fff');ctx.drawImage(logo,38,38,215,85)}
  ctx.fillStyle='#fff';ctx.font='800 48px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.fillText('บันทึกการทำงานพนักงาน SF&T',300,74);
  ctx.font='600 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.fillStyle='#dce8f5';ctx.fillText('สรุปพนักงานทั้งหมด • เวลา • วันทำงาน • วันหยุด • เงินเบิก',302,115);
  roundRect(ctx,24,150,430,62,10,'#fff');ctx.fillStyle='#13243b';ctx.font='800 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.fillText('วันที่  '+thaiDateLong(date),48,190);
  roundRect(ctx,470,150,720,62,10,'#fff');ctx.fillStyle='#13243b';ctx.font='800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.fillText('สถานที่  '+site,494,190);
  roundRect(ctx,1205,150,370,62,10,'#fff');ctx.fillStyle='#13243b';ctx.font='750 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.fillText('รอบเงินเบิก: 10 และ 25',1230,188);
  const imgs=await Promise.all(ranked.map(e=>loadCanvasImage((e.photo_url&&EMBEDDED_PHOTOS[e.photo_url])||e.photo_url||'')));
  for(let idx=0;idx<ranked.length;idx++){
    const e=ranked[idx],r=recFor(e.id),st=stats[e.id]||{work:0,off:0,leave:0,advance:0};const row=Math.floor(idx/cols),col=idx%cols,x=margin+col*(cardW+gap),y=headerH+18+row*(cardH+gap);
    roundRect(ctx,x,y,cardW,cardH,10,'#fff','#ccd6df');
    roundRect(ctx,x+8,y+8,44,42,7,'#8a5b3d');ctx.fillStyle='#fff';ctx.font='800 24px sans-serif';ctx.textAlign='center';ctx.fillText(String(idx+1),x+30,y+38);ctx.textAlign='left';
    const img=imgs[idx];const px=x+4,py=y+4,pw=cardW-8,ph=155;if(img){const ir=img.width/img.height,rr=pw/ph;let sx=0,sy=0,sw=img.width,sh=img.height;if(ir>rr){sw=img.height*rr;sx=(img.width-sw)/2}else{sh=img.width/rr;sy=(img.height-sh)/2}ctx.save();ctx.beginPath();ctx.roundRect(px,py,pw,ph,8);ctx.clip();ctx.drawImage(img,sx,sy,sw,sh,px,py,pw,ph);ctx.restore()}else{ctx.fillStyle='#dbe3ea';ctx.fillRect(px,py,pw,ph);ctx.fillStyle='#6b7b8f';ctx.font='700 18px sans-serif';ctx.textAlign='center';ctx.fillText('ยังไม่มีรูป',x+cardW/2,py+85);ctx.textAlign='left'}
    ctx.fillStyle='#fff';ctx.globalAlpha=.88;ctx.fillRect(x+4,y+128,cardW-8,31);ctx.globalAlpha=1;ctx.fillStyle='#111';const ns=fitText(ctx,e.name,cardW-28,25,16,'800');ctx.font=`800 ${ns}px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif`;ctx.textAlign='center';ctx.fillText(e.name,x+cardW/2,y+152);ctx.textAlign='left';
    const sc=exportShiftColor(r);ctx.fillStyle=sc;ctx.fillRect(x+4,y+161,cardW-8,42);ctx.fillStyle='#fff';ctx.font='800 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.textAlign='center';const shift=r.status==='work'?`${(r.start_time||'08:00').slice(0,5)} - ${(r.end_time||'17:00').slice(0,5)}`:r.status==='off'?'หยุดงาน':'ลา';ctx.fillText(shift,x+cardW/2,y+190);ctx.textAlign='left';
    ctx.fillStyle='#1b2b40';ctx.font='700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif';ctx.fillText(`ทำงาน ${st.work||0} วัน • ${Math.floor((st.totalMinutes||0)/60)} ชม.`,x+16,y+232);ctx.fillStyle='#a60000';ctx.fillText(`หยุด ${st.off||0} วัน${st.leave?` • ลา ${st.leave} วัน`:''}`,x+16,y+260);ctx.fillStyle='#1b2b40';ctx.fillText(`เบิกวันนี้ ${Number(r.advance_amount||0).toLocaleString('th-TH')} บาท`,x+16,y+289);ctx.fillText(`ยอดสะสม ${Number(st.advance||0).toLocaleString('th-TH')} บาท`,x+16,y+316);
  }
  const work=ranked.filter(e=>recFor(e.id).status==='work').length,off=ranked.filter(e=>recFor(e.id).status==='off').length,leave=ranked.filter(e=>recFor(e.id).status==='leave').length,adv=ranked.reduce((s,e)=>s+Number(recFor(e.id).advance_amount||0),0);
  const sy=1260;roundRect(ctx,22,sy,530,220,12,'#fff');ctx.fillStyle='#0f2f55';ctx.font='800 31px sans-serif';ctx.fillText('สรุปวันนี้',48,sy+42);ctx.font='800 27px sans-serif';ctx.fillStyle='#139c43';ctx.fillText(`✓ ทำงาน ${work} คน`,52,sy+87);ctx.fillStyle='#e50914';ctx.fillText(`– หยุดงาน ${off} คน`,52,sy+127);ctx.fillStyle='#9a7200';ctx.fillText(`ลา ${leave} คน`,52,sy+167);ctx.fillStyle='#1b2b40';ctx.fillText(`รวมทั้งหมด ${ranked.length} คน`,52,sy+207);
  roundRect(ctx,565,sy,650,220,12,'#fff');ctx.fillStyle='#0f2f55';ctx.font='800 31px sans-serif';ctx.fillText('สรุปเงินเบิกวันนี้',590,sy+42);ctx.fillStyle='#1b2b40';ctx.font='700 20px sans-serif';let ay=sy+78;const advRows=ranked.filter(e=>Number(recFor(e.id).advance_amount||0)>0);for(const e of advRows.slice(0,6)){ctx.fillText(`${e.name}  ${Number(recFor(e.id).advance_amount).toLocaleString('th-TH')} บาท`,595,ay);ay+=26}ctx.font='900 31px sans-serif';ctx.fillStyle='#0f2f55';ctx.fillText(`รวม ${adv.toLocaleString('th-TH')} บาท`,930,sy+196);
  roundRect(ctx,1228,sy,350,220,12,'#fff');ctx.fillStyle='#e31b23';ctx.font='900 31px sans-serif';ctx.fillText('รอบเงินเบิก',1260,sy+48);ctx.fillStyle='#16273e';ctx.font='800 25px sans-serif';ctx.fillText('รีเซ็ตทุกวันที่',1260,sy+96);ctx.fillStyle='#e31b23';ctx.font='900 45px sans-serif';ctx.fillText('10 และ 25',1260,sy+150);ctx.fillStyle='#6b7b8f';ctx.font='600 18px sans-serif';ctx.fillText('ยอดสะสมเริ่มนับใหม่ตามรอบ',1260,sy+188);
  ctx.fillStyle='#dce8f5';ctx.font='600 18px sans-serif';ctx.textAlign='center';ctx.fillText('บริษัท ศักวิเศษ เฟรม แอนด์ ทรัส จำกัด • SF&T',W/2,H-12);ctx.textAlign='left';
  canvas.toBlob(async blob=>{if(!blob){alert('สร้างรูปไม่สำเร็จ');return}const file=new File([blob],`SFT_Attendance_${date}.png`,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`สรุปการทำงาน ${thaiDateLong(date)}`})}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}}catch(err){if(err?.name!=='AbortError')console.error(err)}sync('ส่งออกเรียบร้อย ✓')},'image/png',0.96)
}
$('#exportDaily').addEventListener('click',exportDailyImage);
$('#workDate').addEventListener('change',loadDaily);
function renderManage(){const ranked=rankEmployees();$('#manageList').innerHTML=ranked.map((e,i)=>`<article class="emp"><div class="emp-top"><img src="${(e.photo_url&&EMBEDDED_PHOTOS[e.photo_url])||e.photo_url||''}"><div><h3><span class="rank">${i+1}</span>${e.name}</h3><div class="muted">${e.full_name||''}</div><div class="actions"><button class="btn soft edit" data-id="${e.id}">แก้ไข</button><button class="btn danger del" data-id="${e.id}">ลบพนักงาน</button></div></div></div></article>`).join('');$$('.edit').forEach(b=>b.addEventListener('click',()=>openEdit(Number(b.dataset.id))));$$('.del').forEach(b=>b.addEventListener('click',()=>removeEmployee(Number(b.dataset.id))))}
$('#addEmployee').addEventListener('click',()=>openEdit());
function openEdit(id){const e=employees.find(x=>x.id===id);$('#empId').value=e?.id||'';$('#empName').value=e?.name||'';$('#empFullName').value=e?.full_name||'';$('#photoPreview').src=(e?.photo_url&&EMBEDDED_PHOTOS[e.photo_url])||e?.photo_url||'';$('#modalTitle').textContent=e?'แก้ไขพนักงาน':'เพิ่มพนักงาน';$('#modal').classList.remove('hide');$('#modal').setAttribute('aria-hidden','false')}
$('#cancelModal').addEventListener('click',closeModal);function closeModal(){$('#modal').classList.add('hide');$('#modal').setAttribute('aria-hidden','true');$('#employeeForm').reset();$('#photoPreview').src=''}
$('#empPhoto').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const data=await resizeImage(f,520,0.78);$('#photoPreview').src=data});
function resizeImage(file,maxW,q){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
$('#employeeForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('#empId').value,name=$('#empName').value.trim();if(!name)return;const body={name,full_name:$('#empFullName').value.trim(),photo_url:$('#photoPreview').src||null,is_active:true,sort_seed:employees.length?Math.max(...employees.map(x=>x.sort_seed||0))+1:1};try{if(id)await api('sft_attendance_employees?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});else await api('sft_attendance_employees',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});closeModal();await loadDaily()}catch(err){alert('บันทึกพนักงานไม่สำเร็จ');console.error(err)}});
async function removeEmployee(id){const e=employees.find(x=>x.id===id);if(!confirm(`ลบ ${e?.name||'พนักงาน'} ออกจากรายชื่อใช้งาน?\nประวัติเดิมจะยังคงอยู่`))return;try{await api('sft_attendance_employees?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({is_active:false})});await loadDaily()}catch(err){alert('ลบไม่สำเร็จ')}}
async function loadHistory(){try{const a=$('#historyFrom').value,b=$('#historyTo').value;const rows=await api(`sft_attendance_records?select=*,sft_attendance_employees(name)&work_date=gte.${a}&work_date=lte.${b}&order=work_date.desc`);$('#historyBody').innerHTML=(rows||[]).map(r=>`<tr><td>${r.work_date}</td><td>${r.sft_attendance_employees?.name||''}</td><td><span class="pill ${r.status}">${r.status==='work'?'ทำงาน':r.status==='off'?'หยุด':'ลา'}</span></td><td>${r.status==='work'?`${(r.start_time||'').slice(0,5)}-${(r.end_time||'').slice(0,5)}`:'-'}</td><td>${r.site||''}</td><td>${fmtMoney(r.advance_amount)}</td></tr>`).join('')}catch(e){console.error(e)}}
$('#loadHistory').addEventListener('click',loadHistory);
$$('.tab').forEach(b=>b.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.tab;$('#dailyView').classList.toggle('hide',t!=='daily');$('#employeesView').classList.toggle('hide',t!=='employees');$('#historyView').classList.toggle('hide',t!=='history');if(t==='history')loadHistory()}));
window.addEventListener('focus',loadDaily);setInterval(loadDaily,60000);loadDaily();
