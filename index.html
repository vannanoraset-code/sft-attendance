<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f2f55" />
<title>SF&T Attendance</title>
<style>
:root{--navy:#0f2f55;--red:#e31b23;--green:#169c48;--blue:#1683e8;--orange:#f5a623;--purple:#7f56d9;--bg:#eef3f8;--card:#fff;--text:#152238;--muted:#6b7b8f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,#092746,#123e6d);color:#fff;padding:14px 14px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0002}.head{display:flex;align-items:center;gap:12px}.head img{width:68px;height:48px;object-fit:contain;background:#fff;border-radius:8px}.head h1{font-size:20px;margin:0}.head p{margin:2px 0 0;font-size:12px;opacity:.85}.tabs{display:flex;gap:8px;margin-top:12px;overflow:auto;padding-bottom:2px}.tab{border:0;border-radius:999px;padding:9px 14px;background:#ffffff1f;color:#fff;white-space:nowrap}.tab.active{background:#fff;color:var(--navy);font-weight:700}
main{padding:12px;max-width:1180px;margin:auto}.panel{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #00000012}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;min-height:44px;padding:9px 10px;border:1px solid #ccd6e0;border-radius:10px;background:#fff;font-size:16px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn{border:0;border-radius:10px;min-height:44px;padding:9px 13px;font-weight:700}.primary{background:var(--navy);color:#fff}.danger{background:#ffe5e5;color:#a00}.soft{background:#edf3f9;color:var(--navy)}.success{background:#e6f6ed;color:#106b35}.employee-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.emp{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #d8e0e8}.emp-top{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:10px}.emp img{width:84px;height:96px;border-radius:10px;object-fit:cover;background:#dde5ec}.emp h3{margin:2px 0 4px;font-size:18px}.muted{color:var(--muted);font-size:12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chip{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef3f8}.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#8a5b3d;color:white;font-weight:800;margin-right:6px}.emp-controls{padding:0 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.emp-controls .full{grid-column:1/-1}.status-work{border-left:5px solid var(--green)}.status-off{border-left:5px solid var(--red)}.status-leave{border-left:5px solid #f1c40f}.shift{font-weight:800;padding:8px 10px;color:#fff}.s-1700{background:var(--green)}.s-1800{background:#3c9ad9}.s-1900{background:var(--blue)}.s-2000{background:var(--purple)}.s-2100{background:var(--orange)}.s-2200{background:var(--red)}.s-off{background:var(--red)}.s-leave{background:#d9a700;color:#1d1d1d}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#f5f8fb;border-radius:12px;padding:10px}.metric b{font-size:22px;display:block}.hide{display:none!important}.notice{padding:10px;border-radius:10px;background:#fff7d6;color:#6c5200;margin-bottom:10px}.sync{font-size:12px;padding:6px 10px;border-radius:999px;background:#ffffff1c;color:#fff;margin-left:auto}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:50}.modal-card{background:#fff;border-radius:16px;padding:14px;max-width:460px;width:100%;max-height:88%;overflow:auto}.modal-card h2{margin-top:0}.photo-preview{width:110px;height:130px;object-fit:cover;border-radius:10px;background:#eef3f8;display:block;margin-bottom:8px}.table-wrap{overflow:auto}.history{width:100%;border-collapse:collapse;min-width:720px}.history th,.history td{padding:8px;border-bottom:1px solid #e4e9ef;text-align:left;font-size:13px}.history th{background:#f2f6fa;position:sticky;top:0}.pill{padding:4px 7px;border-radius:8px;font-size:11px;font-weight:700}.work{background:#def4e7;color:#126c35}.off{background:#ffe1e1;color:#a60000}.leave{background:#fff0b3;color:#6c5100}
@media(max-width:620px){main{padding:8px}.grid2,.grid3{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.employee-list{grid-template-columns:1fr}.emp-top{grid-template-columns:78px 1fr}.emp img{width:78px;height:92px}.head h1{font-size:17px}}
</style>

<style id="v4-manual-save-style">
  .status-pending{border-left-color:#94a3b8!important}
  .status-pending .shift{background:#64748b!important;color:#fff!important}
  .save-one{width:100%;margin-top:10px;background:#0f3f73!important;color:#fff!important;font-weight:800!important}
  .save-state{font-size:14px;font-weight:700;color:#64748b;margin-top:8px}
  .save-state.dirty{color:#b45309}
  .save-state.saved{color:#15803d}
  #saveAll,#applyBulk,#bulkShift{display:none!important}
</style>


<style id="v6-group-style">
  .group-title{margin:18px 4px 10px;padding:12px 14px;border-radius:14px;font-weight:900;font-size:18px}
  .saved-group{background:#dcfce7;color:#166534}
  .pending-group{background:#f1f5f9;color:#475569}
  .absent-group{background:#fee2e2;color:#991b1b}
  .emp select.start,.emp select.morning-out,.emp select.afternoon-in,.emp select.end{
    width:100%; min-height:56px; font-size:22px; text-align:center; background:#fff;
  }
</style>

let employees=[], records=[], stats={};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
async function api(path,opts={}){
  if(path.startsWith('sft_attendance_employees?select=')){const x=await edge('action=employees');return x.rows||[]}
  if(path.startsWith('sft_attendance_records?select=*,sft_attendance_employees')){const a=(path.match(/work_date=gte\.([^&]+)/)||[])[1]||'1900-01-01',b=(path.match(/work_date=lte\.([^&]+)/)||[])[1]||'2999-12-31';const x=await edge('action=history&from='+encodeURIComponent(a)+'&to='+encodeURIComponent(b));return x.rows||[]}
  if(path.startsWith('sft_attendance_records?select=')){const m=path.match(/work_date=eq\.([^&]+)/);const x=await edge('action=records'+(m?'&date='+encodeURIComponent(m[1]):''));return x.rows||[]}
  if(path.startsWith('sft_attendance_records?on_conflict=')){await edge('action=save-records',{method:'POST',body:opts.body});return null}
  if(path.startsWith('sft_attendance_employees?id=eq.') && opts.method==='PATCH'){const id=Number((path.match(/id=eq\.(\d+)/)||[])[1]);const body=JSON.parse(opts.body||'{}');if(body.is_active===false){await edge('action=remove-employee',{method:'POST',body:JSON.stringify({id})})}else{await edge('action=save-employee',{method:'POST',body:JSON.stringify({...body,id})})}return null}
  if(path==='sft_attendance_employees' && opts.method==='POST'){await edge('action=save-employee',{method:'POST',body:opts.body});return null}
  throw new Error('คำสั่ง API ไม่รองรับ: '+path)
}
function sync(msg,ok=true){$('#syncState').textContent=msg;$('#syncState').style.background=ok?'#ffffff1c':'#8b1d1d'}
function shiftClass(start,end,status){if(status==='off')return's-off';if(status==='leave')return's-leave';if(end==='17:00:00'||end==='17:00')return's-1700';if(end==='18:00:00'||end==='18:00')return's-1800';if(end==='19:00:00'||end==='19:00')return's-1900';if(end==='20:00:00'||end==='20:00')return's-2000';if(end==='21:00:00'||end==='21:00')return's-2100';return's-2200'}
function fmtMoney(n){return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0})+' บาท'}
function formatHalf(n){const v=Math.round((Number(n)||0)*2)/2;return Number.isInteger(v)?String(v):v.toFixed(1)}
function recFor(id){
  const found=records.find(r=>r.employee_id===id);
  const r=found||{
    employee_id:id,
    status:'pending',
    start_time:'',
    morning_out:'',
    afternoon_in:'',
    end_time:'',
    advance_amount:0,

}
function attendanceCycleStart(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  const start=new Date(y,m,day>=16?16:1);
  return start.toISOString().slice(0,10);
}
function advanceCycleStart(dateStr){return attendanceCycleStart(dateStr)}
function minutesBetween(start,end){if(!start||!end)return 0;const [sh,sm]=String(start).slice(0,5).split(':').map(Number),[eh,em]=String(end).slice(0,5).split(':').map(Number);if([sh,sm,eh,em].some(Number.isNaN))return 0;let mins=(eh*60+em)-(sh*60+sm);if(mins<0)mins+=24*60;return Math.max(0,mins)}
function normalizePunches(r){
  if(!r)return r;
  const a=(r.start_time||'').slice(0,5), b=(r.morning_out||'').slice(0,5), c=(r.afternoon_in||'').slice(0,5), d=(r.end_time||'').slice(0,5);
  // Legacy/invalid pattern: start_time is already afternoon (13:00 or later).
  // Move it into afternoon_in and clear morning session.
  if(a && a>='13:00'){
    if(!c || c<'13:00') r.afternoon_in=a;
    r.start_time='';
    r.morning_out='';
  }
  return r;
}
function workedMinutesRec(r){
  if(!r||r.status!=='work')return 0;
  normalizePunches(r);
  const a=(r.start_time||'').slice(0,5),b=(r.morning_out||'').slice(0,5),c=(r.afternoon_in||'').slice(0,5),d=(r.end_time||'').slice(0,5);
  let mins=0;
  if(a&&b) mins+=minutesBetween(a,b);

  if(mins===0 && a&&d) mins=minutesBetween(a,d);

}
function otMinutes(r){return Math.max(0,workedMinutesRec(r)-480)}
function dayWorkText(r){const m=workedMinutesRec(r),ot=Math.max(0,m-480);if(m>=480)return `1 วัน${ot?` • OT ${Math.floor(ot/60)} ชม.${ot%60?` ${ot%60} นาที`:''}`:''}`;return `${Math.floor(m/60)} ชม.${m%60?` ${m%60} นาที`:''}`}
function time4Text(r){
  normalizePunches(r);
  const a=(r.start_time||'').slice(0,5),b=(r.morning_out||'').slice(0,5),c=(r.afternoon_in||'').slice(0,5),d=(r.end_time||'').slice(0,5);
  if(a&&b&&c&&d) return `${a}–${b} / ${c}–${d}`;
  if(c&&d) return `${c}–${d}`;

async function loadStats(){
  const all=await api('sft_attendance_records?select=employee_id,status,work_date,start_time,morning_out,afternoon_in,end_time,advance_amount&order=work_date.asc');
  const selected=$('#workDate').value,cycle=advanceCycleStart(selected),attendanceCycle=attendanceCycleStart(selected);
  stats={};
  const byEmp={};
  for(const e of employees){
    stats[e.id]={work:0,off:0,leave:0,advance:0,totalMinutes:0,otMinutes:0,streak:0};
    byEmp[e.id]=[];
  }
  for(const r0 of all||[]){
    const r=normalizePunches({...r0});
    if(!stats[r.employee_id])continue;
    if(r.work_date>='2026-09-01'&&r.work_date<=selected){
      byEmp[r.employee_id].push(r);
    }
    if(r.work_date>=attendanceCycle&&r.work_date<=selected){
      if(r.status==='work'){
        const m=workedMinutesRec(r);
        stats[r.employee_id].totalMinutes+=m;
        stats[r.employee_id].otMinutes+=Math.max(0,m-480);
        if(m>0) stats[r.employee_id].work+=Math.round((m/480)*2)/2;
      }else if(r.status==='off'){
        stats[r.employee_id].off+=1;
      }else if(r.status==='leave'){
        stats[r.employee_id].leave+=1;
      }
    }
    if(r.work_date>=cycle&&r.work_date<=selected){
      stats[r.employee_id].advance+=Number(r.advance_amount||0);
    }
  }

  for(const e of employees){
    const rows=(byEmp[e.id]||[]).sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date)));
    let streak=0, started=false;
    for(const r of rows){
      if(!started){
        if(r.work_date!==selected) continue;
        started=true;
      }
      if(r.status==='work' && workedMinutesRec(r)>0){
        streak+=1;
        continue;
      }
      break;
    }
    stats[e.id].streak=streak;
  }
}

function isFemaleEmployee(e){
  const n=((e.name||'')+' '+(e.full_name||'')).toLowerCase();
  return n.includes('คินวิน') || n.includes('khin win') ||
         n.includes(' วัน') || n.includes('vanh sainho') ||
         n.includes('miss.') || n.includes('mrs.');
}

function rankEmployees(){
  return [...employees].sort((a,b)=>{
    const sa=stats[a.id]||{}, sb=stats[b.id]||{};
    const ra=recFor(a.id), rb=recFor(b.id);

    const group = (r)=>{
      if(r.status==='pending') return 0;                       // รอกรอกข้อมูลไว้บนสุด เพื่อกรอกได้เร็ว
      if(r.status==='work' && workedMinutesRec(r)>0) return 1; // บันทึกทำงานแล้ว
      return 2;                                                // หยุด/ลา ไว้ท้าย
    };

    const ga=group(ra), gb=group(rb);
    if(ga!==gb) return ga-gb;

    // คนที่ยังรอกรอก ไม่ต้องรันอันดับ ให้คงลำดับตั้งต้น
    if(ga===0){
      return (a.sort_seed||999)-(b.sort_seed||999);
    }

    // คนที่บันทึกทำงานแล้ว ใช้กติกาอันดับเดิม
    if(ga===1){
      // แรงงานหลัก: ผู้ชายจัดอันดับก่อนผู้หญิงเสมอ
      const genderA=isFemaleEmployee(a)?1:0;
      const genderB=isFemaleEmployee(b)?1:0;
      if(genderA!==genderB) return genderA-genderB;

      // เกณฑ์ผลงานเดิม
      const perf =
        (sb.streak||0)-(sa.streak||0)
        || (sb.work||0)-(sa.work||0)
        || (sb.otMinutes||0)-(sa.otMinutes||0)
        || (sb.totalMinutes||0)-(sa.totalMinutes||0)
        || ((sa.off||0)+(sa.leave||0))-((sb.off||0)+(sb.leave||0));

      if(perf!==0) return perf;

      // ถ้าผลงานทุกอย่างเท่ากัน ให้คนที่เบิกเงินสะสมน้อยกว่าขึ้นก่อน
      const advanceDiff=(sa.advance||0)-(sb.advance||0);
      if(advanceDiff!==0) return advanceDiff;

      return (a.sort_seed||999)-(b.sort_seed||999);
    }

    // คนหยุด/ลาอยู่ท้าย คงลำดับตั้งต้นเพื่ออ่านง่าย
    const genderA=isFemaleEmployee(a)?1:0;
    const genderB=isFemaleEmployee(b)?1:0;
    if(genderA!==genderB) return genderA-genderB;
    return (a.sort_seed||999)-(b.sort_seed||999);
  });
}

}


function timeRangeOptions(value='',start='00:00',end='23:30'){
  const selected=(value||'').slice(0,5);
  const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
  const fmt=n=>`${String(Math.floor((n%(24*60))/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
  const a=toMin(start),b=toMin(end);
  let times=[];
  if(a<=b){
    for(let n=a;n<=b;n+=30) times.push(fmt(n));
  }else{
    for(let n=a;n<24*60;n+=30) times.push(fmt(n));
    for(let n=0;n<=b;n+=30) times.push(fmt(n));
  }
  if(selected && !times.includes(selected)) times.unshift(selected);
  let html='<option value="">--:--</option>';
  for(const t of times) html+=`<option value="${t}" ${selected===t?'selected':''}>${t}</option>`;
  return html;
}

function snapToHalfHour(value){
  if(!value) return '';
  const m=value.match(/^(\d{2}):(\d{2})/);
  if(!m) return value;
  let h=Number(m[1]), min=Number(m[2]);
  if(min<15) min=0;
  else if(min<45) min=30;
  else { min=0; h=(h+1)%24; }
  return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}

function normalizeHalfHourInputs(el){
  el.querySelectorAll('input[type="time"]').forEach(inp=>{
    if(inp.value) inp.value=snapToHalfHour(inp.value);
  });
}

function markDirtyOriginal(el){
  const state=el.querySelector('.save-state');
  if(state){
    state.textContent='ยังไม่ได้บันทึก';
    state.classList.remove('saved');
    state.classList.add('dirty');
  }
}

function markDirty(){
  markDirtyOriginal.apply(this,arguments);

  // เติมเวลาปกติทันทีเมื่อสถานะของการ์ดนี้เป็น "ทำงาน"
  const srcEl=(arguments[0] && arguments[0].target) ? arguments[0].target :
              (arguments[0] && arguments[0].nodeType===1 ? arguments[0] : document.activeElement);
  const card=(srcEl && srcEl.closest) ? (srcEl.closest('.emp') || srcEl.closest('.card') || srcEl.closest('[data-employee-id]') || srcEl.closest('[data-id]')) : null;
  if(!card) return;

  const status=card.querySelector('select[data-field="status"], select.status, select[name="status"]');
  if(!status || status.value!=='work') return;

  const setBlank=(selector,val)=>{
    const el=card.querySelector(selector);
    if(el && !el.value) el.value=val;
  };
  setBlank('select[data-field="start_time"],select[name="start_time"]','08:00');
  setBlank('select[data-field="morning_out"],select[name="morning_out"]','12:00');
  setBlank('select[data-field="afternoon_in"],select[name="afternoon_in"]','13:00');
  setBlank('select[data-field="end_time"],select[name="end_time"]','17:00');
}


function bindDailyCards(){
  document.querySelectorAll('.emp').forEach(el=>{
    const start=el.querySelector('.start');
    const mo=el.querySelector('.morning-out');
    const ai=el.querySelector('.afternoon-in');
    const status=el.querySelector('.status');

    const refreshControls=()=>{
      // ไม่บันทึกอัตโนมัติ และไม่เรียงอันดับจนกว่าจะกด "บันทึกคนนี้"
      if(start && start.value && start.value>='13:00'){
        ai.value=start.value;
        start.value='';
        mo.value='';
      }
      const afternoonOnly=!start.value && !!ai.value;
      start.disabled=afternoonOnly;
      mo.disabled=afternoonOnly;
      if(afternoonOnly) mo.value='';

      const disabled=status.value==='off'||status.value==='leave'||status.value==='pending';
      [start,mo,ai,el.querySelector('.end')].forEach(x=>{
        if(x) x.disabled=disabled || (afternoonOnly&&(x===start||x===mo));
      });
      markDirty(el);
    };

    el.querySelectorAll('select,input').forEach(x=>{
      x.addEventListener('change',()=>{ refreshControls(); markDirty(el); });
      x.addEventListener('input',()=>markDirty(el));
    });

    // ถ้าผู้ใช้เลือก "ทำงาน" ให้ช่องเวลาเปิด แต่ไม่เติมเวลาให้อัตโนมัติ
    status.addEventListener('change',()=>{
      if(status.value==='work'){
        start.disabled=false; mo.disabled=false; ai.disabled=false; el.querySelector('.end').disabled=false;
      }
      refreshControls();
    });

    const btn=el.querySelector('.save-one');
    btn.addEventListener('click',()=>saveOneEmployee(el,btn));
  });
}

async function saveOneEmployee(el,btn){

}

function hasUnsavedDrafts(){
  return !!document.querySelector('.save-state.dirty');
}
async function safeAutoRefresh(){
  if(document.hidden || hasUnsavedDrafts()) return;
  const active=document.activeElement;
  if(active && active.closest && active.closest('#employeeList')) return;
  await loadDaily();
}
window.addEventListener('focus',()=>{if(!hasUnsavedDrafts()) safeAutoRefresh()});
setInterval(safeAutoRefresh,60000);

document.addEventListener('change',(ev)=>{
  const t=ev.target;
  const field=t?.dataset?.field || t?.name || '';
  if(!t || field!=='status' || t.value!=='work') return;

  const card=t.closest('.emp-card') || t.closest('[data-emp]') || t.closest('[data-id]') || t.closest('.card');
  if(!card) return;

  const setTime=(fieldName,value)=>{
    const el=card.querySelector(`[data-field="${fieldName}"]`) || card.querySelector(`[name="${fieldName}"]`);
    if(el && !el.value){
      el.value=value;
      el.dispatchEvent(new Event('input',{bubbles:true}));
      el.dispatchEvent(new Event('change',{bubbles:true}));
    }
  };

  setTime('start_time','08:00');
  setTime('morning_out','12:00');
  setTime('afternoon_in','13:00');
  setTime('end_time','17:00');

  const state=card.querySelector('.save-state');
  if(state){state.classList.add('dirty');state.textContent='ยังไม่ได้บันทึก';}
});
restoreLastWorkDate();
loadDaily();

</script>
</body></html>
